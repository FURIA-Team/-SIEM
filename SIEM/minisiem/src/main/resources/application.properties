spring.application.name=minisiem

# SQLite Database
spring.datasource.url=jdbc:sqlite:./minisiem.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Resolve the existing HomeController view name to the static dashboard.
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html

# Set this environment variable to a one-time secret of at least 32 characters to create the first administrator.
minisiem.bootstrap.admin-token=${MINISIEM_ADMIN_BOOTSTRAP_TOKEN:}